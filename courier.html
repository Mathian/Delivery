<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Панель курьера</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* ── COURIER-SPECIFIC STYLES ── */
    :root {
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    #app { min-height: 100vh; }

    /* SCREENS */
    .screen { display: none; }
    .screen.active { display: block; }

    /* LOADING */
    #s-loading {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
    }
    #s-loading.active { display: flex; }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* NO-UID */
    #s-no-uid {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px;
      text-align: center;
      gap: 16px;
    }
    #s-no-uid.active { display: flex; }
    .no-uid-icon { font-size: 64px; }
    .no-uid-title { font-size: 20px; font-weight: 700; color: var(--text); }
    .no-uid-sub { color: var(--text-muted); line-height: 1.5; }

    /* MAIN SCREEN */
    #s-main { display: none; flex-direction: column; min-height: 100vh; }
    #s-main.active { display: flex; }

    /* TOP BAR */
    .topbar {
      background: var(--primary);
      color: #fff;
      padding: 14px 16px 10px;
      position: sticky; top: 0; z-index: 100;
    }
    .topbar-row {
      display: flex; align-items: center; justify-content: space-between;
    }
    .topbar-title { font-size: 17px; font-weight: 700; }
    .courier-name-badge {
      font-size: 13px; opacity: 0.85;
      background: rgba(255,255,255,.15);
      border-radius: 20px; padding: 3px 10px;
    }

    /* SHIFT BANNER */
    .shift-banner {
      background: #d1fae5;
      border-bottom: 1px solid #a7f3d0;
      padding: 10px 16px;
      display: none;
    }
    .shift-banner-inner {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 13px; color: #065f46;
    }
    .shift-info { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .shift-label { font-weight: 600; }

    /* SHIFT ACTIONS */
    .shift-actions {
      padding: 12px 16px;
      display: flex; gap: 10px;
    }

    /* BUTTONS */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; padding: 10px 18px;
      border: none; border-radius: 8px;
      font-size: 14px; font-weight: 600;
      cursor: pointer; transition: opacity .15s, transform .1s;
      text-decoration: none;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-warning { background: var(--warning); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-secondary { background: var(--border); color: var(--text); }
    .btn-outline { background: transparent; border: 1.5px solid var(--primary); color: var(--primary); }
    .btn-lg { padding: 13px 22px; font-size: 15px; flex: 1; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }

    /* TABS */
    .tabs {
      display: flex; border-bottom: 2px solid var(--border);
      background: var(--card-bg);
    }
    .tab-btn {
      flex: 1; padding: 12px 8px;
      border: none; background: transparent;
      font-size: 14px; font-weight: 500; color: var(--text-muted);
      cursor: pointer; transition: color .15s, border-color .15s;
      border-bottom: 2px solid transparent; margin-bottom: -2px;
    }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 700; }
    .tab-content { display: none; flex: 1; overflow-y: auto; }
    .tab-content.active { display: block; }

    /* ORDER CARDS */
    .orders-list { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .order-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 16px;
      cursor: pointer;
      transition: transform .1s, box-shadow .1s;
      border-left: 4px solid var(--primary);
    }
    .order-card:active { transform: scale(.98); }
    .order-card.order-late { border-left-color: var(--danger); }
    .order-card-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 6px;
    }
    .order-client { font-weight: 700; font-size: 15px; }
    .order-number { font-size: 12px; color: var(--text-muted); background: var(--bg); padding: 2px 8px; border-radius: 20px; }
    .order-address { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
    .order-times { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
    .icon { display: inline; }

    /* COUNTDOWN BAR */
    .countdown-bar-wrap {
      height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; margin-bottom: 4px;
    }
    .countdown-bar {
      height: 100%; background: var(--success); border-radius: 3px;
      transition: width .5s ease;
    }
    .countdown-bar.bar-late { background: var(--danger); }
    .countdown-label { font-size: 11px; color: var(--text-muted); text-align: right; }
    .text-danger { color: var(--danger) !important; }

    /* HISTORY */
    .history-list { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .history-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 12px 14px;
    }
    .history-card-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .history-number { font-weight: 700; font-size: 14px; }
    .history-total { font-weight: 700; color: var(--success); }
    .history-address { font-size: 13px; color: var(--text-muted); margin-bottom: 3px; }
    .history-time { font-size: 12px; color: var(--text-muted); }

    /* EMPTY STATE */
    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 60px 24px;
      gap: 12px; color: var(--text-muted); text-align: center;
    }
    .empty-icon { font-size: 52px; }

    /* BOTTOM SHEET */
    .bottom-sheet {
      position: fixed; inset: 0; z-index: 300;
      pointer-events: none; opacity: 0;
      transition: opacity .3s;
    }
    .bottom-sheet.open { pointer-events: auto; opacity: 1; }
    .bottom-sheet-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,.45);
    }
    .bottom-sheet-content {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: var(--card-bg);
      border-radius: 20px 20px 0 0;
      max-height: 90vh; overflow-y: auto;
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(.4,0,.2,1);
    }
    .bottom-sheet.open .bottom-sheet-content { transform: translateY(0); }
    .sheet-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--card-bg); z-index: 10;
    }
    .sheet-header h3 { font-size: 17px; font-weight: 700; }
    .sheet-close {
      background: var(--bg); border: none; border-radius: 50%;
      width: 30px; height: 30px; cursor: pointer;
      font-size: 14px; display: flex; align-items: center; justify-content: center;
    }
    .sheet-body { padding: 16px 20px 32px; }
    .detail-section { margin-bottom: 18px; }
    .section-title { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
    .detail-row { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 14px; gap: 12px; }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: var(--text-muted); flex-shrink: 0; }
    .detail-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 14px; border-bottom: 1px solid var(--border); }
    .detail-item:last-child { border-bottom: none; }
    .detail-item-name { flex: 1; }
    .detail-item-qty { color: var(--text-muted); min-width: 32px; text-align: center; }
    .detail-item-price { font-weight: 600; min-width: 64px; text-align: right; }
    .detail-total { font-size: 16px; font-weight: 700; text-align: right; padding-top: 10px; }
    .sheet-actions { display: flex; gap: 10px; margin-top: 20px; }

    /* CONFIRM DIALOG */
    .confirm-overlay {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,.5);
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .confirm-dialog {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      max-width: 320px; width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,.2);
    }
    .confirm-message { font-size: 15px; line-height: 1.5; margin-bottom: 20px; text-align: center; }
    .confirm-actions { display: flex; gap: 10px; }
    .confirm-actions .btn { flex: 1; }

    /* TOAST */
    .toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #1e293b; color: #fff;
      padding: 10px 20px; border-radius: 24px;
      font-size: 14px; font-weight: 500;
      z-index: 1000; pointer-events: none;
      opacity: 0; transition: opacity .25s, transform .25s;
      white-space: nowrap; max-width: 90vw;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast-success { background: #065f46; }
    .toast-error { background: #991b1b; }
    .toast-info { background: #1e40af; }
  </style>
</head>
<body>
<div id="app">

  <!-- SCREEN: LOADING -->
  <div id="s-loading" class="screen active">
    <div class="spinner"></div>
    <p style="color:#64748b;font-size:14px;">Загрузка...</p>
  </div>

  <!-- SCREEN: NO UID -->
  <div id="s-no-uid" class="screen">
    <div class="no-uid-icon">🔒</div>
    <div class="no-uid-title">Доступ запрещён</div>
    <div class="no-uid-sub">Ваш аккаунт не найден или не имеет прав курьера.<br>Обратитесь к администратору.</div>
  </div>

  <!-- SCREEN: MAIN -->
  <div id="s-main" class="screen">

    <!-- TOP BAR -->
    <div class="topbar">
      <div class="topbar-row">
        <span class="topbar-title">Панель курьера</span>
        <span class="courier-name-badge" id="courier-name">Загрузка...</span>
      </div>
    </div>

    <!-- SHIFT BANNER -->
    <div class="shift-banner" id="shift-banner">
      <div class="shift-banner-inner">
        <div class="shift-info">
          <span class="shift-label">🟢 Смена активна</span>
          <span>Начало: <strong id="shift-start-time">—</strong></span>
          <span>Длительность: <strong id="shift-duration">—</strong></span>
        </div>
      </div>
    </div>

    <!-- SHIFT ACTIONS -->
    <div class="shift-actions">
      <button class="btn btn-primary" id="btn-start-shift" style="display:none;">
        ▶ Начать смену
      </button>
      <button class="btn btn-outline" id="btn-end-shift" style="display:none;">
        ■ Завершить смену
      </button>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="active">📦 Активные</button>
      <button class="tab-btn" data-tab="history">📋 История</button>
    </div>

    <!-- TAB: ACTIVE DELIVERIES -->
    <div class="tab-content active" data-tab="active">
      <div class="orders-list" id="active-orders-list">
        <div class="empty-state">
          <div class="empty-icon">📦</div>
          <p>Нет активных доставок</p>
        </div>
      </div>
    </div>

    <!-- TAB: HISTORY -->
    <div class="tab-content" data-tab="history">
      <div class="history-list" id="history-orders-list">
        <div class="empty-state">
          <div class="empty-icon">📋</div>
          <p>История доставок пуста</p>
        </div>
      </div>
    </div>

  </div><!-- /#s-main -->

</div><!-- /#app -->

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="../js/config.js"></script>
<script src="../js/db.js"></script>
<script src="../js/courier.js"></script>
</body>
</html>
